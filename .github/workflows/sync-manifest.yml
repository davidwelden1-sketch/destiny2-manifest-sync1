name: Sync Bungie Manifest
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and index official manifest
        run: python scripts/sync_manifest.py
      - name: Upload auditable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bungie-manifest-index
          path: output/
          retention-days: 30
