name: Publish VAELTRION research feed
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/publish_research.py', '.github/workflows/publish-research.yml']
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: vaeltrion-research-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/publish_research.py
