name: Test Destiny Simulation Engine
on:
  push:
    branches: [main]
    paths:
      - 'simulator/**'
      - 'tests/**'
      - '.github/workflows/test-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run simulator unit tests
        run: python -m unittest discover -s tests -v
