name: Autonomous Build Lab audit
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Produce evidence-safe status report
        run: python -m simulator.automation_report
      - name: Run theoretical defensive scenario sweep
        run: python -m simulator.automated_sweep
      - name: Run historical PvP breakpoint sweep
        run: python -m simulator.pvp_ttk_sweep
      - name: Publish report as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-lab-audit-${{ github.run_id }}
          path: |
            reports/latest.json
            reports/shield_sweep.json
            reports/pvp_ttk_sweep.json
          retention-days: 30
      - name: Open or update failure tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Build Lab automated workflow failure"
          body="An hourly Build Lab run failed. Review the logs and repair the underlying cause. Latest failed run: ${RUN_URL}"
          existing=$(gh issue list --repo "$REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Build Lab automated workflow failure") | .number' | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
          fi
