name: Sync Extended Destiny Definitions
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and index definitions
        run: python scripts/sync_extended.py
      - name: Validate definitions and build item-perk relationship index
        run: python scripts/validate_extended.py
      - name: Audit referenced weapon plug-set completeness
        run: python scripts/audit_plugset_integrity.py
      - name: Build searchable socket candidate index
        run: python scripts/build_socket_candidates.py
      - name: Audit candidate index
        run: python scripts/audit_candidates.py
      - name: Report exact weapon hashes with hidden or unknown randomized sockets
        run: python scripts/audit_weapon_socket_visibility.py
      - name: Audit Bungie socket-type whitelist compatibility of randomized weapon plugs
        run: python scripts/audit_weapon_socket_categories.py
      - name: Audit explicit component category labels versus unclassified trait sockets
        run: python scripts/audit_weapon_socket_roles.py
      - name: Index exact-hash initial frame plug candidates without certifying active frames
        run: python scripts/audit_weapon_frame_candidates.py
      - name: Cross-audit frame-labelled initial plugs against randomized weapon sockets
        run: python scripts/audit_frame_plug_reuse.py
      - name: Summarize game-wide randomized weapon sockets
        run: python scripts/query_weapon_pairs.py
      - name: Resolve Explosive Payload plus Firefly by exact perk hashes and exact weapon variant
        run: python -m scripts.query_named_weapon_perks --perk-a "Explosive Payload" --perk-b "Firefly"
      - name: Compare exact-hash Explosive Payload and Firefly current-roll and visibility evidence
        run: python -m scripts.audit_named_pair_filters --perk-a "Explosive Payload" --perk-b "Firefly"
      - name: Query dual Void Breach pickup trait sockets
        run: python scripts/query_weapon_pairs.py --plug-a 1767911158 --plug-b 2562668800
      - name: Query explicitly current-roll dual Void Breach trait sockets
        run: python scripts/query_weapon_pairs.py --plug-a 1767911158 --plug-b 2562668800 --currently-rollable-only
      - name: Query explicitly current and default-visible dual trait sockets
        run: python scripts/query_weapon_pairs.py --plug-a 1767911158 --plug-b 2562668800 --currently-rollable-only --default-visible-only
      - name: Audit all same-name weapon variant randomized socket pools
        run: python scripts/audit_weapon_variants.py
      - name: Audit phantom perk pairs created by cross-variant name merging
        run: python scripts/audit_cross_variant_phantom_pairs.py
      - name: Compare same-name weapon variant perk pools
        run: |
          python scripts/compare_weapon_variants.py --name Lotus-Eater
          python scripts/compare_weapon_variants.py --name Keraunios
      - name: Index ability candidates
        run: python scripts/index_ability_candidates.py
      - name: Upload extended dataset
        uses: actions/upload-artifact@v4
        with:
          name: destiny-extended-definitions
          path: output/
          retention-days: 30
