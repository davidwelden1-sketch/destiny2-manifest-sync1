name: Sync Extended Destiny Definitions
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and index definitions
        run: python scripts/sync_extended.py
      - name: Upload extended dataset
        uses: actions/upload-artifact@v4
        with:
          name: destiny-extended-definitions
          path: output/
          retention-days: 30
